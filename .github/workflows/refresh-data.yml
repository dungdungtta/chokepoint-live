name: Live Data Feed — Auto Refresh

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    name: Fetch & Commit Live Data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch live data
        env:
          EIA_API_KEY:       ${{ secrets.EIA_API_KEY }}
          NEWSAPI_KEY:       ${{ secrets.NEWSAPI_KEY }}
          FRED_API_KEY:      ${{ secrets.FRED_API_KEY }}
          WORKERS_URL:       ${{ secrets.WORKERS_URL }}
        run: node scripts/fetch-data.js

      - name: Commit updated data.json
        run: |
          git config user.name  "chokepoint-bot"
          git config user.email "bot@chokepoint.io"
          if git diff --quiet public/data.json; then
            echo "변경 없음"
          else
            git add public/data.json
            git commit -m "data: auto-refresh $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi